name: ci/gh-actions/build-test

# Native developer builds, the same way as described in README.md.
# Release binaries are produced by build.yml (depends).

# runs for new tags, newly opened pull requests and on demand (Actions tab / gh workflow run)
on:
  workflow_dispatch:
  push:
    tags: [ '*' ]
  pull_request:
    types: [ opened, reopened ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CCACHE_MAXSIZE: 400M
  CCACHE_COMPRESS: 'true'
  CMAKE_C_COMPILER_LAUNCHER: ccache
  CMAKE_CXX_COMPILER_LAUNCHER: ccache

jobs:
  windows:
    name: windows (msys2 ucrt64)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive
    - uses: msys2/setup-msys2@v2
      with:
        msystem: UCRT64
        update: true
        pacboy: >-
          toolchain:p cmake:p ccache:p boost:p openssl:p libsodium:p
          hidapi:p libusb:p unbound:p pkgconf:p readline:p
        install: git make patch autotools zip
    - name: ccache
      uses: actions/cache@v6
      with:
        path: .ccache
        key: ccache-msys2-ucrt64-${{ github.sha }}
        restore-keys: ccache-msys2-ucrt64-
    - name: build
      run: |
        export CCACHE_DIR="$(pwd)/.ccache"
        make -j$(nproc) release-static-win-x86_64
        ccache -s
    - name: check for non-system DLL imports
      run: |
        cd build/release/bin
        objdump -p morelod.exe | grep 'DLL Name'
        ! objdump -p *.exe | grep 'DLL Name' | grep -viE 'api-ms-win|advapi32|crypt32|iphlpapi|kernel32|mswsock|shell32|user32|ws2_32|bcrypt|setupapi|ole32|hid'
    - name: package
      run: |
        cd build/release/bin
        strip *.exe
        zip -9 -q ../win-x64-ucrt64.zip *.exe
    - uses: actions/upload-artifact@v7
      with:
        name: win-x64-ucrt64
        path: build/release/win-x64-ucrt64.zip
        compression-level: 0

  linux:
    name: ${{ matrix.os }} (system packages)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-22.04 ships Boost 1.74 (the minimum supported), ubuntu-24.04 ships Boost 1.83
        os: [ ubuntu-22.04, ubuntu-24.04 ]
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive
    - name: install dependencies
      run: |
        sudo apt-get update
        sudo apt-get -y install build-essential cmake pkg-config ccache libboost-all-dev libssl-dev libsodium-dev libunbound-dev libreadline-dev libhidapi-dev libusb-1.0-0-dev libudev-dev autoconf automake libtool-bin
    - name: ccache
      uses: actions/cache@v6
      with:
        path: .ccache
        key: ccache-${{ matrix.os }}-${{ github.sha }}
        restore-keys: ccache-${{ matrix.os }}-
    - name: build
      run: |
        # ARCH=x86-64 instead of the default -march=native, ccache objects are shared between runners with different CPUs
        make -j$(nproc) release flags="-DBUILD_TESTS=OFF -DARCH=x86-64"
        ccache -s
    - name: smoke test
      run: build/release/bin/morelod --version
