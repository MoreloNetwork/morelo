name: ci/gh-actions/build

# runs for new tags, newly opened pull requests and on demand (Actions tab / gh workflow run)
on:
  workflow_dispatch:
  push:
    tags: [ '*' ]
  pull_request:
    types: [ opened, reopened ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 400M
  CCACHE_COMPRESS: 'true'
  CMAKE_C_COMPILER_LAUNCHER: ccache
  CMAKE_CXX_COMPILER_LAUNCHER: ccache
  ANDROID_NDK_VERSION: r29

jobs:
  build:
    name: ${{ matrix.tag }}
    runs-on: ${{ matrix.runner || 'ubuntu-24.04' }}
    # manylinux_2_28 (AlmaLinux 8, glibc 2.28, GCC 14) keeps the Linux binaries runnable on old distros
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - tag: linux-x64
            host: x86_64-linux-gnu
            container: quay.io/pypa/manylinux_2_28_x86_64
            boost_arch: x64
          - tag: linux-arm64
            host: aarch64-linux-gnu
            runner: ubuntu-24.04-arm
            container: quay.io/pypa/manylinux_2_28_aarch64
            boost_arch: a64
          - tag: win-x64
            host: x86_64-w64-mingw32
          - tag: android-arm64
            host: aarch64-linux-android
    env:
      HOST: ${{ matrix.host }}
    steps:
    - name: install dependencies (manylinux)
      if: matrix.container
      run: dnf -y install epel-release && dnf -y install ccache autoconf automake libtool gperf perl-IPC-Cmd perl-Time-Piece patch xz bzip2 file which
    - name: install dependencies (ubuntu)
      if: '!matrix.container'
      run: |
        sudo apt-get update
        sudo apt-get -y install --no-install-recommends ccache autoconf automake libtool-bin gperf pkg-config zip
        if [ "$HOST" = x86_64-w64-mingw32 ]; then
          sudo apt-get -y install --no-install-recommends g++-mingw-w64-x86-64
          sudo update-alternatives --set x86_64-w64-mingw32-g++ $(which x86_64-w64-mingw32-g++-posix)
          sudo update-alternatives --set x86_64-w64-mingw32-gcc $(which x86_64-w64-mingw32-gcc-posix)
        fi
    - uses: actions/checkout@v7
      with:
        submodules: recursive
    - name: install android ndk
      if: contains(matrix.host, 'android')
      run: |
        curl -sSfLO https://dl.google.com/android/repository/android-ndk-${ANDROID_NDK_VERSION}-linux.zip
        unzip -q android-ndk-${ANDROID_NDK_VERSION}-linux.zip -d $RUNNER_TEMP
        rm android-ndk-${ANDROID_NDK_VERSION}-linux.zip
        echo "ANDROID_NDK=$RUNNER_TEMP/android-ndk-${ANDROID_NDK_VERSION}" >> $GITHUB_ENV
    - name: depends cache
      uses: actions/cache@v6
      with:
        path: |
          contrib/depends/built
          contrib/depends/sources
        key: depends-${{ matrix.host }}-${{ env.ANDROID_NDK_VERSION }}-${{ hashFiles('contrib/depends/packages/*', 'contrib/depends/hosts/*', 'contrib/depends/patches/**', 'contrib/depends/Makefile', 'contrib/depends/funcs.mk') }}
        restore-keys: depends-${{ matrix.host }}-${{ env.ANDROID_NDK_VERSION }}-
    - name: ccache
      uses: actions/cache@v6
      with:
        path: .ccache
        key: ccache-${{ matrix.host }}-${{ github.sha }}
        restore-keys: ccache-${{ matrix.host }}-
    - name: build
      run: |
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        make -j$(nproc) depends target=$HOST
        if [ "${HOST#*android}" != "$HOST" ]; then make -C build/release -j$(nproc) wallet_api; fi
        ccache -s
    - name: package
      run: |
        mkdir -p out/${{ matrix.tag }}
        cp build/release/bin/* out/${{ matrix.tag }}/
        case "$HOST" in
          *mingw32) STRIP=x86_64-w64-mingw32-strip ;;
          *android*) STRIP=$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip ;;
          *) STRIP=strip ;;
        esac
        $STRIP out/${{ matrix.tag }}/*
        cd out
        if [ "$HOST" = x86_64-w64-mingw32 ]; then
          (cd ${{ matrix.tag }} && zip -9 -q ../${{ matrix.tag }}.zip *)
          ARCHIVE=${{ matrix.tag }}.zip
        else
          tar cJf ${{ matrix.tag }}.tar.xz --owner=0 --group=0 -C ${{ matrix.tag }} .
          ARCHIVE=${{ matrix.tag }}.tar.xz
        fi
        sha256sum $ARCHIVE | tee $ARCHIVE.sha256
        ls -la ${{ matrix.tag }}
        echo "### ${{ matrix.tag }}" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        cat $ARCHIVE.sha256 >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
    - name: package wallet library
      if: contains(matrix.host, 'android')
      run: |
        mkdir -p out/lib/lib out/lib/include
        find build/release -name '*.a' -exec cp {} out/lib/lib/ \;
        cp contrib/depends/$HOST/lib/*.a out/lib/lib/
        cp src/wallet/api/wallet2_api.h out/lib/include/
        tar cJf out/${{ matrix.tag }}-libwallet.tar.xz --owner=0 --group=0 -C out/lib .
    - name: check glibc requirement
      if: contains(matrix.host, 'linux-gnu')
      run: |
        v=$(objdump -T out/${{ matrix.tag }}/* | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
        echo "highest required: $v"
        [ -n "$v" ] && [ "$(printf '%s\n' GLIBC_2.27 "$v" | sort -V | tail -1)" = GLIBC_2.27 ]
    - name: build TLS check
      if: contains(matrix.host, 'linux-gnu')
      run: |
        P=contrib/depends/$HOST
        B=${{ matrix.boost_arch }}
        g++ -std=c++14 -O1 -Icontrib/epee/include -Iexternal/easylogging++ -I$P/include .github/tlscheck/tlscheck.cpp -o out/tlscheck \
          build/release/contrib/epee/src/libepee.a build/release/external/easylogging++/libeasylogging.a \
          $P/lib/libboost_thread-mt-s-$B.a $P/lib/libboost_chrono-mt-s-$B.a $P/lib/libboost_filesystem-mt-s-$B.a $P/lib/libboost_date_time-mt-s-$B.a $P/lib/libboost_regex-mt-s-$B.a $P/lib/libboost_atomic-mt-s-$B.a \
          $P/lib/libssl.a $P/lib/libcrypto.a -static-libstdc++ -static-libgcc -pthread -ldl
        strip out/tlscheck
    - uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.tag }}
        path: |
          out/*.zip
          out/*.tar.xz
          out/*.sha256
        compression-level: 0
    - uses: actions/upload-artifact@v7
      if: contains(matrix.host, 'linux-gnu')
      with:
        name: tlscheck-${{ matrix.tag }}
        path: out/tlscheck

  linux-compat:
    name: ${{ matrix.tag }} on ${{ matrix.image }}
    needs: build
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        tag: [ linux-x64, linux-arm64 ]
        image: [ 'ubuntu:18.04', 'debian:10', 'ubuntu:20.04', 'rockylinux:8', 'archlinux:latest' ]
        include:
          - tag: linux-x64
            runner: ubuntu-24.04
          - tag: linux-arm64
            runner: ubuntu-24.04-arm
        exclude:
          # the official Arch image is amd64 only
          - tag: linux-arm64
            image: 'archlinux:latest'
    steps:
    - uses: actions/download-artifact@v8
      with:
        name: ${{ matrix.tag }}
    - name: run
      run: |
        mkdir bin && tar xJf ${{ matrix.tag }}.tar.xz -C bin
        for b in morelod morelo-wallet-cli morelo-wallet-rpc; do
          docker run --rm -v "$PWD/bin:/bin-morelo:ro" ${{ matrix.image }} /bin-morelo/$b --version
        done
    - uses: actions/download-artifact@v8
      if: matrix.image == 'rockylinux:8' || matrix.image == 'archlinux:latest'
      with:
        name: tlscheck-${{ matrix.tag }}
    - name: TLS with the system CA certificates (updater downloads)
      if: matrix.image == 'rockylinux:8' || matrix.image == 'archlinux:latest'
      run: |
        chmod +x tlscheck
        docker run --rm -v "$PWD/tlscheck:/tlscheck:ro" ${{ matrix.image }} /tlscheck github.com
        ! docker run --rm -v "$PWD/tlscheck:/tlscheck:ro" ${{ matrix.image }} /tlscheck self-signed.badssl.com
