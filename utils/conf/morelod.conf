# Configuration for morelod
# Syntax: any command line option may be specified as 'clioptionname=value'.
# See 'morelod --help' for all available options.

data-dir=/var/lib/morelo
log-file=/var/log/morelo/morelod.log
log-level=1
public-node=
#zmq-enabled
#zmq-bind-ip=0.0.0.0
#zmq-max_clients=8
rpc-bind-ip=0.0.0.0
restricted-rpc=
confirm-external-bind=
# IPv6 is off by default; the p2p and RPC servers then listen on the same ports over both families
#p2p-use-ipv6=1
#p2p-bind-ipv6-address=::
#rpc-use-ipv6=1
#rpc-bind-ipv6-address=::
